# Render Blueprint: New + > Blueprint > pick this repo/branch. Render reads this file.
services:
  - type: web
    name: siuru-talentmatch
    runtime: python
    plan: starter            # a persistent disk needs a paid plan; free plans lose all data on every deploy
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TM_ENV
        value: production
      - key: TM_DATA_DIR
        value: /var/data            # the persistent disk below: database + uploaded resumes
      - key: TM_USER
        value: hr
      - key: TM_PASSWORD
        sync: false                 # Render asks you for it in the dashboard - never commit it
    disk:
      name: talentmatch-data
      mountPath: /var/data
      sizeGB: 5
